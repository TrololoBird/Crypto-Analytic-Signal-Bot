[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-signal-bot"
version = "9.0.0"
description = "Event-driven cryptocurrency signal bot using Binance USD-M public market data."
readme = "README.md"
# Standard build: Python 3.14.5 (not 3.14t). CI pins 3.14.5 explicitly.
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
authors = [{ name = "Crypto Signal Bot" }]
dependencies = [
    "python-dotenv>=1.2.2",
    "polars>=1.41.2",
    "aiohttp>=3.13.5,<3.14",
    "aiohttp-socks>=0.10.1",
    "python-socks[asyncio]>=2.7.1",
    "numpy>=2.4.6",
    "aiogram>=3.28.2",
    "websockets>=16.0,<17.0",
    "aiosqlite>=0.22.1",
    "msgspec>=0.21.1",
    "tenacity>=9.1.4",
    "structlog>=25.5.0",
    "pydantic>=2.13.4,<2.14",
]

[project.urls]
Homepage = "https://github.com/TrololoBird/Crypto-Analytic-Signal-Bot"
Documentation = "https://github.com/TrololoBird/Crypto-Analytic-Signal-Bot/blob/main/docs/REFACTOR_PLAN.md"
Repository = "https://github.com/TrololoBird/Crypto-Analytic-Signal-Bot"
Issues = "https://github.com/TrololoBird/Crypto-Analytic-Signal-Bot/issues"

[project.optional-dependencies]
dev = ["ruff==0.15.16", "mypy>=2.1.0", "pre-commit>=4.6.0"]
live = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "prometheus-client>=0.25.0",
    "orjson>=3.11.9",
    "polars_ta>=0.5.17",
    "polars-ols>=0.3.5",
]
test = ["pytest>=9.0.3", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0"]
regime = ["hmmlearn>=0.3.3", "scikit-learn>=1.8.0", "statsmodels>=0.14.6"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [
    ".git",
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "graphify-out",
    "data",
    "telemetry",
    "build",
    "dist",
    "scripts/_archive",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "RUF",
    "ARG",
    "LOG",
    "ISC",
    "ICN",
    "G",
    "INP",
    "EM",
    "RET",
    "FBT",
    "EXE",
    "FA",
    "PIE",
    "PYI",
    "FURB",
    "PERF",
    "TRY",
    "PLC",
    "PLE",
    "PLW",
    "DTZ",
    "TCH",
    "PTH",
    "PT",
    "ASYNC",
    "BLE",
    "NPY",
    "PGH",
    "RSE",
]
# No blanket ignores — fix violations in source (see reports/ruff_inventory_summary.md).

[tool.ruff.lint.per-file-ignores]
# Late imports after module constants (circular-import guard in ws/rest_impl)
"bot/market/ws.py" = ["E402"]
"bot/market/rest_impl.py" = ["E402"]
"bot/market/**/*.py" = ["E501"]
"bot/migrations.py" = ["E501"]
"bot/persistence/sl_forensics.py" = ["BLE001", "ARG001", "PERF401"]
"bot/persistence/tracking_events.py" = ["TC001", "TC003"]
"bot/market/kline_window.py" = ["SIM108", "BLE001"]
"bot/runtime/_analyzer_gates.py" = ["TC001"]
"bot/runtime/_delivery_ranking.py" = ["TC001"]
"bot/runtime/delivery_orchestrator.py" = ["TC001", "TRY300", "E501"]
"bot/runtime/bot.py" = ["E501"]
"bot/persistence/tracking.py" = ["E501"]
"bot/dashboard/**/*.py" = ["RUF001", "RUF002", "E501", "BLE001", "PERF401", "ARG001", "RUF006"]
"bot/delivery/formatting.py" = ["RUF001", "E501"]
"bot/domain/labels.py" = ["RUF001"]
"bot/**/*.py" = ["RUF001", "RUF002", "PLC0415", "RUF006"]
"tests/**/*.py" = [
    "PLC0415",
    "ARG001",
    "ARG002",
    "ARG005",
    "PT019",
    "ASYNC109",
    "ASYNC240",
    "B015",
    "RUF001",
    "E501",
]
"scripts/**/*.py" = [
    "EXE001",
    "E402",
    "PLC0415",
    "PLW2901",
    "PTH123",
    "ASYNC240",
    "SIM115",
    "TRY401",
    "BLE001",
    "TRY300",
    "TRY301",
    "TRY003",
    "ARG001",
    "RUF001",
    "RUF012",
    "E501",
    "TC002",
    "FURB162",
    "FURB171",
    "PYI034",
    "EM101",
    "G201",
    "PERF401",
]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
show_error_codes = true
pretty = false
# Full `mypy bot/` — strict; CI gates `scripts/run_mypy_critical.py`.

[[tool.mypy.overrides]]
module = "bot.dashboard.*"
disallow_untyped_decorators = false
disable_error_code = [
    "no-any-return",
    "union-attr",
    "attr-defined",
    "operator",
    "arg-type",
]

[[tool.mypy.overrides]]
module = "bot.market.data"
disable_error_code = ["arg-type", "no-any-return", "var-annotated"]

[[tool.mypy.overrides]]
module = "bot.market.rest_frames"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "bot.market.rest_impl"
disable_error_code = ["no-any-return", "return"]

[[tool.mypy.overrides]]
module = "bot.features.*"
disable_error_code = ["arg-type", "call-overload"]

[[tool.mypy.overrides]]
module = "bot.strategies.*"
disable_error_code = [
    "arg-type",
    "return-value",
    "no-untyped-def",
    "attr-defined",
]

[[tool.mypy.overrides]]
module = "bot.setups.*"
disable_error_code = ["arg-type", "dict-item"]

[[tool.mypy.overrides]]
module = "bot.runtime.market_context_updater"
disable_error_code = ["union-attr", "arg-type"]

[[tool.mypy.overrides]]
module = "bot.persistence.*"
disable_error_code = ["return-value", "index", "arg-type"]

[[tool.mypy.overrides]]
module = "bot.logging_config"
disable_error_code = ["list-item"]

[[tool.mypy.overrides]]
module = "bot.delivery.tiers"
disable_error_code = ["arg-type"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits Binance public API (requires network)",
    "slow: tests that take >30s or require extended runtime",
]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
