[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-signal-bot"
version = "9.0.0"
description = "Event-driven cryptocurrency signal bot using Binance USD-M public market data."
readme = "README.md"
# Standard build: Python 3.14.5 (not 3.14t). CI pins 3.14.5 explicitly.
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
authors = [{ name = "Crypto Signal Bot" }]
dependencies = [
    "python-dotenv>=1.2.2",
    "polars>=1.41.2",
    "aiohttp>=3.13.5,<3.14",
    "aiohttp-socks>=0.10.1",
    "python-socks[asyncio]>=2.7.1",
    "numpy>=2.4.6",
    "aiogram>=3.28.2",
    "websockets>=16.0,<17.0",
    "aiosqlite>=0.22.1",
    "msgspec>=0.21.1",
    "tenacity>=9.1.4",
    "structlog>=25.5.0",
    "pydantic>=2.13.4,<2.14",
]

[project.urls]
Homepage = "https://github.com/TrololoBird/Crypto-Analytic-Signal-Bot"
Documentation = "https://github.com/TrololoBird/Crypto-Analytic-Signal-Bot/blob/main/docs/REFACTOR_PLAN.md"
Repository = "https://github.com/TrololoBird/Crypto-Analytic-Signal-Bot"
Issues = "https://github.com/TrololoBird/Crypto-Analytic-Signal-Bot/issues"

[project.optional-dependencies]
dev = [
    "ruff==0.15.15",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
]
live = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "prometheus-client>=0.25.0",
    "orjson>=3.11.9",
    "polars_ta>=0.5.17",
    "polars-ols>=0.3.5",
]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
regime = [
    "hmmlearn>=0.3.3",
    "scikit-learn>=1.8.0",
    "statsmodels>=0.14.6",
]
# Offline ML experiments only — not imported by `python main.py`.
ml = [
    "joblib>=1.5.3",
    "lightgbm>=4.6.0",
    "xgboost>=3.2.0",
    "optuna>=4.8.0",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F821", "F822", "F823"]

[tool.ruff.lint.per-file-ignores]
"bot/strategies/*.py" = ["F405", "E402"]
"bot/strategies/_common.py" = ["F405"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
show_error_codes = true
pretty = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits Binance public API (requires network)",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
