name: Bug report
description: Runtime, CI, or data-plane defect (non-security)
title: "[bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        For **security** issues see [SECURITY.md](https://github.com/TrololoBird/Crypto-Analytic-Signal-Bot/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Observed vs expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. python main.py run\n2. …"
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit or tag (if known)
      placeholder: e7f4606 or main @ 2026-06-05

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - market / REST / WS
        - strategies / engine
        - delivery / Telegram
        - persistence / telemetry
        - CI / tooling
        - other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / telemetry snippet
      description: Redact tokens and chat IDs.
