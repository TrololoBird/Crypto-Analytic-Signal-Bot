name: Auto Fix & Format

on:
  push:
    branches: [main, develop]
    paths:
      - "bot/**"
      - "tests/**"
      - "pyproject.toml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autofix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14.5"

jobs:
  auto-format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fix with ruff + Python 3.14 except syntax
        run: |
          ruff check --fix bot/ tests/
          ruff format bot/ tests/
          python scripts/fix_py314_except.py bot/ tests/
          python -m compileall -q bot tests

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: auto-format with ruff (py3.14 except fix)"
          title: "Auto: format with ruff"
          body: |
            Automatic formatting and linting fixes:
            - Ruff check --fix + format
            - `scripts/fix_py314_except.py` after format (Python 3.14 requirement)
          branch: chore/auto-format
          delete-branch: true
          labels: automated,formatting
