name: Auto Fix & Format

on:
  push:
    branches: [main, dev]
    paths:
      - "bot/**"
      - "tests/**"
      - "scripts/**"
      - "hunt-watch/**"
      - "main.py"
      - "pyproject.toml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autofix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14.5"

jobs:
  auto-format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fix with ruff
        run: |
          ruff check --fix bot/ tests/ scripts/ main.py hunt-watch/
          ruff format bot/ tests/ scripts/ main.py hunt-watch/
          python -m compileall -q bot tests hunt-watch

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          commit-message: "chore: auto-format with ruff"
          title: "Auto: format with ruff"
          body: |
            Automatic formatting and linting fixes:
            - Ruff check --fix + format
          branch: chore/auto-format
          delete-branch: true
          labels: automated,formatting
