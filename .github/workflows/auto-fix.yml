name: Auto Fix & Format

on:
  push:
    branches: [main, dev]
    paths:
      - "bot/**"
      - "tests/**"
      - "scripts/**"
      - "hunt-watch/**"
      - "main.py"
      - "pyproject.toml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autofix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14.5"

jobs:
  auto-format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fix with ruff
        run: |
          ruff check --fix bot/ tests/ scripts/ main.py hunt-watch/
          ruff format bot/ tests/ scripts/ main.py hunt-watch/
          python -m compileall -q bot tests hunt-watch

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: auto-format with ruff"
          title: "Auto: format with ruff"
          body: |
            Automatic formatting and linting fixes:
            - Ruff check --fix + format
          branch: chore/auto-format
          delete-branch: true
          labels: automated,formatting
