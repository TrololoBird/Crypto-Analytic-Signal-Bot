name: Nightly Regression

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.5"
          cache: "pip"

      - name: Install regression dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test,live]"

      - name: Compile bot package
        run: python -m compileall -q bot

      - name: Validate config
        run: python scripts/validate_config.py --config config.toml.example

      - name: Live Binance public API tests
        run: pytest tests/live/ -v -m live
        env:
          PYTEST_LIVE: "1"

      - name: Live strategy smoke (limited)
        run: python -m scripts.live_check_strategies --limit 10 --concurrency 2
        continue-on-error: true
