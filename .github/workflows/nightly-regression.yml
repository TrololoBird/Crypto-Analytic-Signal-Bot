name: Nightly Regression

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TELEGRAM_BOT_TOKEN: "1234567890:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
  TELEGRAM_CHAT_ID: "-1000000000000"

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.5"
          cache: "pip"

      - name: Install regression dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test,live]"

      - name: Compile bot package
        run: python -m compileall -q bot

      - name: Validate config
        run: python scripts/validate_config.py --config config.toml.example

      - name: Live Binance public API tests
        run: pytest tests/live/ -v -m live
        env:
          PYTEST_LIVE: "1"

      - name: Live strategy smoke (limited)
        run: python -m scripts.live_check_strategies --limit 10 --concurrency 2
        continue-on-error: true
