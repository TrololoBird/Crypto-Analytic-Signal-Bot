# Block PRs that introduce dependencies with known critical/high CVEs.
name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4.2.2

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4.8.2
        with:
          fail-on-severity: critical
          comment-summary-in-pr: always
          deny-licenses: GPL-3.0, AGPL-3.0
