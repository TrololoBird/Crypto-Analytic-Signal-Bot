name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14.5"
  CONFIG_PATH: config.toml.example

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint (ruff + syntax)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Assert Python version
        run: |
          python -V | grep -F "3.14.5"
          python -c "import sys; assert sys.version_info[:3] == (3, 14, 5), sys.version"

      - name: Install ruff (pinned in pyproject dev extras)
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: >-
          ruff check bot/ tests/
          scripts/validate_config.py scripts/verify_refactor_gate.py
          scripts/fix_py314_except.py

      - name: Ruff format (apply + verify clean tree)
        run: |
          ruff format bot/ tests/
          python scripts/fix_py314_except.py bot/ tests/
          git diff --exit-code -- bot/ tests/

      - name: Legacy multi-except guard (Python 3.14)
        run: |
          if rg -n '^\s*except [A-Za-z_][A-Za-z0-9_.]*, ' bot tests; then
            echo "Found legacy except syntax; run scripts/fix_py314_except.py"
            exit 1
          fi

      - name: Compile
        run: python -m compileall -q bot tests

  unit:
    runs-on: ubuntu-latest
    name: Unit tests + gates
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e ".[dev,test]"

      - name: Verify dependency imports
        run: python scripts/verify_dependencies.py

      - name: Validate config
        run: python scripts/validate_config.py --config ${{ env.CONFIG_PATH }}

      - name: v9 refactor gate
        run: python scripts/verify_refactor_gate.py

      - name: Project health audit
        run: python scripts/project_health_audit.py --stale-days 2

      - name: Pytest (offline)
        run: pytest tests/ -q --ignore=tests/live

  typecheck:
    runs-on: ubuntu-latest
    name: Type check (mypy critical)
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + mypy
        run: pip install -e ".[dev]"

      - name: Mypy critical modules (pydantic plugin)
        run: python scripts/run_mypy_critical.py

  typecheck-report:
    runs-on: ubuntu-latest
    name: Type check report (full bot/)
    needs: lint
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Mypy full bot/ (informational)
        run: mypy bot/

  live-binance:
    runs-on: ubuntu-latest
    name: Live Binance (public API)
    needs: unit
    timeout-minutes: 25
    # Rate limits / network flakiness — advisory on PRs, required on main pushes
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install live test dependencies
        run: pip install -e ".[dev,test,live]"

      - name: Live pytest
        run: pytest tests/live/ -q -m live --maxfail=3
        env:
          PYTEST_LIVE: "1"

  ci-ok:
    runs-on: ubuntu-latest
    name: CI required checks
    needs: [lint, unit, typecheck]
    if: always()
    steps:
      - name: Require lint, unit, and typecheck
        run: |
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs.typecheck.result }}" = "success"
