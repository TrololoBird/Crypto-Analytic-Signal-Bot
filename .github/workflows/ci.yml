name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14.5"
  CONFIG_PATH: config.toml.example
  # Placeholders for validate_config (provider=telegram in config.toml.example).
  TELEGRAM_BOT_TOKEN: "1234567890:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
  TELEGRAM_CHAT_ID: "-1000000000000"

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint (ruff + syntax)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Assert Python version
        run: |
          python -V | grep -F "3.14.5"
          python -c "import sys; assert sys.version_info[:3] == (3, 14, 5), sys.version"

      - name: Install ruff (pinned in pyproject dev extras)
        run: pip install -e ".[dev]"

      - name: Ruff check (full tree)
        run: ruff check bot/ tests/ scripts/ main.py hunt-watch/

      - name: Ruff format (apply + verify clean tree)
        run: |
          ruff format bot/ tests/ scripts/ main.py hunt-watch/
          git diff --exit-code -- bot/ tests/ scripts/ main.py hunt-watch/

      - name: Legacy multi-except guard (Python 3.14)
        run: |
          if rg -n '^\s*except [A-Za-z_][A-Za-z0-9_.]*, ' bot tests; then
            echo "Found legacy except syntax; use tuple form: except (A, B):"
            exit 1
          fi

      - name: Compile
        run: python -m compileall -q bot tests hunt-watch

  unit:
    runs-on: ubuntu-latest
    name: Unit tests + gates
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e ".[live,dev,test]"

      - name: Verify dependency imports
        run: python scripts/verify_dependencies.py

      - name: Validate config
        run: python scripts/validate_config.py --config ${{ env.CONFIG_PATH }}

      - name: v9 refactor gate
        run: python scripts/verify_refactor_gate.py

      - name: Project health audit
        run: python scripts/project_health_audit.py --stale-days 2

      - name: Pytest (live-only suite; skip live without PYTEST_LIVE)
        run: pytest tests/ -q

  typecheck:
    runs-on: ubuntu-latest
    name: Type check (mypy critical)
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + mypy
        run: pip install -e ".[dev]"

      - name: Mypy critical modules (pydantic plugin)
        run: python scripts/run_mypy_critical.py

  typecheck-report:
    runs-on: ubuntu-latest
    name: Type check report (full bot/)
    needs: lint
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Mypy full bot/ (informational)
        run: |
          mypy bot/ > mypy-full-report.txt 2>&1 || true
          cat mypy-full-report.txt
          echo "mypy full report is informational only (critical gate: run_mypy_critical.py)"

  live-binance:
    runs-on: ubuntu-latest
    name: Live Binance (public API)
    needs: unit
    timeout-minutes: 25
    # Rate limits / network flakiness — advisory on PRs, required on main pushes
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install live test dependencies
        run: pip install -e ".[dev,test,live]"

      - name: Live pytest
        run: pytest tests/live/ -q -m live --maxfail=3
        env:
          PYTEST_LIVE: "1"

  ci-ok:
    runs-on: ubuntu-latest
    name: CI required checks
    needs: [lint, unit, typecheck]
    if: always()
    steps:
      - name: Require lint, unit, and typecheck
        run: |
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs.typecheck.result }}" = "success"
