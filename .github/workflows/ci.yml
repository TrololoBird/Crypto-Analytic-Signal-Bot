name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  CONFIG_PATH: config.toml.example

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint (ruff)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install ruff
        run: pip install "ruff>=0.9"
      - name: Ruff check
        run: ruff check bot/ tests/ scripts/validate_config.py scripts/verify_refactor_gate.py
      - name: Ruff format (check only)
        run: ruff format --check bot/ tests/

  unit:
    runs-on: ubuntu-latest
    name: Unit tests + gates
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package
        run: pip install -e ".[dev,test]"
      - name: Compile bot package
        run: python -m compileall -q bot
      - name: Validate config
        run: python scripts/validate_config.py --config ${{ env.CONFIG_PATH }}
      - name: v9 refactor gate
        run: python scripts/verify_refactor_gate.py
      - name: Pytest (offline)
        run: pytest tests/ -q --ignore=tests/live

  typecheck:
    runs-on: ubuntu-latest
    name: Type check (mypy critical)
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Mypy critical modules
        run: >-
          mypy bot/delivery/confluence.py bot/domain/config.py
          bot/runtime/merge.py bot/engine/lanes.py
          --follow-imports=skip --ignore-missing-imports

  typecheck-report:
    runs-on: ubuntu-latest
    name: Type check report (non-blocking)
    needs: lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Mypy full bot/
        run: mypy bot/ --ignore-missing-imports

  live-binance:
    runs-on: ubuntu-latest
    name: Live Binance (public API)
    needs: unit
    # Public REST/WS only; may flake on rate limits — does not block merge on PR forks
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install live test dependencies
        run: pip install -e ".[dev,test,live]"
      - name: Live pytest
        run: pytest tests/live/ -q -m live --maxfail=3
        env:
          PYTEST_LIVE: "1"

  ci-ok:
    runs-on: ubuntu-latest
    name: CI required checks
    needs: [lint, unit, typecheck]
    if: always()
    steps:
      - name: Require lint, unit, and typecheck
        run: |
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs.typecheck.result }}" = "success"
