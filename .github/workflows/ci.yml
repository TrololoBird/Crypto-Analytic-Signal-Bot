name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint (ruff)
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install ruff
        run: pip install ruff>=0.9
      - name: Run ruff check with fixes
        run: ruff check --fix bot/ tests/ || true
      - name: Run ruff format
        run: ruff format bot/ tests/ || true
      - name: Commit and push fixes if on branch
        if: github.ref != 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot/ tests/ || true
          if ! git diff --quiet --cached; then
            git commit -m "chore: auto-format with ruff"
            git push
          fi
        continue-on-error: true

  typecheck:
    runs-on: ubuntu-latest
    name: Type Check (mypy)
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-typecheck-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-typecheck-
      - name: Install dependencies
        run: pip install -e '.[dev]' 2>&1 | grep -v 'Multiple top-level' || true
      - name: Run mypy on critical files
        run: mypy bot/ml/filter.py bot/confluence.py --follow-imports=skip --ignore-missing-imports
        continue-on-error: false

  typecheck-full-report:
    runs-on: ubuntu-latest
    name: Type Check Full Report (mypy)
    needs: lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-typecheck-full-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-typecheck-full-
      - name: Install dependencies
        run: pip install -e '.[dev]' 2>&1 | grep -v 'Multiple top-level' || true
      - name: Run mypy full analysis
        run: mypy bot/ --ignore-missing-imports --strict

  test:
    runs-on: ubuntu-latest
    name: Tests (pytest)
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-
      - name: Install dependencies
        run: pip install -e '.[dev,test]' 2>&1 | grep -v 'Multiple top-level' || true
      - name: Run pytest
        run: pytest tests/ -v --cov=bot --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
