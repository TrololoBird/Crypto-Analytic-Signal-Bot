# Promote dev → main after CI passes on the PR.
# Requires repo setting: Settings → General → Allow auto-merge.
name: Dev to Main

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    if: github.event.pull_request.head.ref == 'dev' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge when checks pass
        uses: peter-evans/enable-pull-request-automerge@6606513a12654917012fdbb1b1a8b0d5b68d1e6 # v3.1.0
        with:
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
